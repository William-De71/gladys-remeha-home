# -----------------------------------------------------------------------------
# Continuous integration: every pull request, and the quality gate of the
# Release workflow (workflow_call) on every push to main. No `push` trigger of
# its own on main: release.yml runs it there, so a release is never cut from a
# commit whose checks failed.
#
#   1. Prettier, ESLint and the tests, on Node 22 (the oldest version
#      `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks, without the image check (the image of a
#      version only exists once it is released);
#   3. the Docker image, built for amd64 and never pushed, then started like
#      Gladys runs it: a broken Dockerfile or a module that does not load
#      shows up here rather than in a release.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Checks only read the code: no write scope for the token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gladys-remeha-home:ci

      # The image as Gladys runs it (read-only, unprivileged, 256 MB, no
      # network): every module loads, a climate zone with a fireplace mode
      # becomes a device of 5 features (mode, setpoint, operating state, room
      # temperature, fireplace), a hot water tank a device of 4 (mode, comfort
      # setpoint, heating, water temperature), the appliance a device of 3
      # (pressure, outdoor temperature, energy index), /data/state.json is
      # written with mode 0600. Update the counts with the features.
      - name: Smoke test of the image
        run: |
          set -euo pipefail
          docker run --rm --read-only --memory 256m --network none --user node \
            --tmpfs /data:uid=1000,gid=1000 --entrypoint node gladys-remeha-home:ci \
            --input-type=module -e "
              const { createApp } = await import('/app/src/app.js');
              const { parseDashboard } = await import('/app/src/remeha.js');
              const { buildDevice } = await import('/app/src/device.js');
              const { createState } = await import('/app/src/state.js');
              const { statSync } = await import('node:fs');
              const ids = { externalIds: (type, id) => ({ device: 'ext:remeha:' + type + ':' + id, feature: (key) => 'ext:remeha:' + type + ':' + id + ':' + key }) };
              const parsed = parseDashboard({ appliances: [{ applianceId: 'a1', houseName: 'Home', applianceType: 'Boiler', waterPressure: 1.5, waterPressureOK: true, capabilityEnergyConsumption: true,
                outdoorTemperatureInformation: { cloudOutdoorTemperature: 7 },
                climateZones: [{ climateZoneId: 'c1', name: 'Living room', zoneMode: 'Scheduling', activeComfortDemand: 'Idle', roomTemperature: 19.5, setPoint: 20, setPointMin: 5, setPointMax: 30, capabilityFirePlaceMode: true, firePlaceModeActive: false }],
                hotWaterZones: [{ hotWaterZoneId: 'd1', name: 'DHW', dhwZoneMode: 'Scheduling', dhwStatus: 'Idle', dhwType: 'Tank', dhwTemperature: 50, comfortSetPoint: 55, capabilityBoostMode: true }] }] });
              const zone = buildDevice(ids, parsed.zones[0]);
              const water = buildDevice(ids, parsed.hotWaters[0]);
              const appliance = buildDevice(ids, parsed.appliances[0]);
              const state = createState({ path: '/data/state.json' });
              state.setSnapshot('a1', { status: 'running', pressureOk: true, online: true, holiday: false });
              state.save();
              const mode = statSync('/data/state.json').mode & 0o777;
              if (typeof createApp !== 'function' || zone.features.length !== 5 || water.features.length !== 4 || appliance.features.length !== 3 || mode !== 0o600 || typeof fetch !== 'function') {
                process.exit(1);
              }
              console.log('modules load, 5 features for a zone, 4 for the hot water, 3 for the appliance, /data/state.json is 0600');
            "
